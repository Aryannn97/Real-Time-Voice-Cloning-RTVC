[project]
name = "real-time-voice-cloning"
version = "0.1.0"
requires-python = ">=3.10,<3.13"

dependencies = [
  "huggingface-hub>=0.26",
  "inflect>=5.3",
  "librosa>=0.10",
  "matplotlib>=3.5",
  "numpy>=1.26,<2",
  "PyQt5==5.15.11",
  "scikit-learn>=1.0",
  "scipy>=1.7",
  "sounddevice>=0.4.3",
  "soundfile>=0.12",
  "tqdm>=4.62",
  "umap-learn>=0.5.2",
  "Unidecode>=1.3",
  "visdom>=0.1.8.9",
  "webrtcvad-wheels>=2.0.10",
]

[project.optional-dependencies]
# Modern multilingual engine (XTTS-v2). Its weights are non-commercial, see the README.
xtts = ["coqui-tts>=0.26", "six"]
# CPU-only torch
cpu  = ["torch>=2.4"]
# NVIDIA GPU torch
cuda = ["torch>=2.4"]

[dependency-groups]
# Dev/test dependencies
dev = ["pytest"]

# Map extras -> PyTorch wheel indexes so uv knows where to fetch torch
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",   extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
required-environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
